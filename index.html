<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Frigoríficos</title>
</head>
<body>

<!-- Mover los estilos al body para que Geotab no los borre al inyectar el Add-in -->
<style>
  .cold-chain-app {
    --color-bg: #F4F8FB;
    --color-surface: #FFFFFF;
    --color-primary: #0F2A47;
    --color-primary-hover: #163A5F;
    --color-accent: #0EA5E9;
    --color-text: #1A2433;
    --color-text-muted: #5B6B7C;
    --color-border: #DCE6EF;
    --color-ok-bg: #E7F6EE; --color-ok-fg: #067647; --color-ok-bar: #059669;
    --color-go-bg: #FCEAEA; --color-go-fg: #B3261E; --color-go-bar: #DC2626;
    --color-iox-bg: #FDEAE0; --color-iox-fg: #B4460A; --color-iox-bar: #EA580C;
    --color-cargo-bg: #FDF3E3; --color-cargo-fg: #92590A; --color-cargo-bar: #CA8A04;
    --color-machine-bg: #EEEDFC; --color-machine-fg: #4338CA; --color-machine-bar: #6366F1;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    font-family: var(--font-ui);
    background: var(--color-bg);
    color: var(--color-text);
    font-size: 14px;
    line-height: 1.5;
    max-width: 1380px;
    margin: 0 auto;
    padding: 20px 20px 60px;
    box-sizing: border-box;
  }

  .cold-chain-app * { box-sizing: border-box; }

  .cold-chain-app .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .cold-chain-app .topbar-left { display: flex; align-items: center; gap: 14px; }
  .cold-chain-app h1 { font-size: 20px; margin: 0; color: var(--color-primary); font-weight: 700; line-height: 1.2; }
  .cold-chain-app .subtitle { margin: 2px 0 0; color: var(--color-text-muted); font-size: 13px; }

  .cold-chain-app .btn { font: inherit; font-weight: 600; border-radius: 7px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; }
  .cold-chain-app .btn-primary { background: var(--color-primary); color: #fff; }
  .cold-chain-app .btn-primary:hover { background: var(--color-primary-hover); }
  .cold-chain-app .btn-primary:disabled { opacity: .6; cursor: default; }
  .cold-chain-app .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .cold-chain-app .form-select { font: inherit; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); cursor: pointer; min-width: 200px; }
  .cold-chain-app .form-select:focus { outline: 2px solid var(--color-accent); outline-offset: -1px; border-color: transparent; }

  .cold-chain-app .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .cold-chain-app .summary-card { flex: 1; min-width: 130px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 12px 14px; border-top: 3px solid var(--color-border); }
  .cold-chain-app .summary-card .num { font-size: 22px; font-weight: 700; color: var(--color-text); font-family: var(--font-mono); }
  .cold-chain-app .summary-card .lbl { font-size: 12px; color: var(--color-text-muted); }
  .cold-chain-app .summary-card.ok { border-top-color: var(--color-ok-bar); }
  .cold-chain-app .summary-card.go { border-top-color: var(--color-go-bar); }
  .cold-chain-app .summary-card.iox { border-top-color: var(--color-iox-bar); }
  .cold-chain-app .summary-card.cargo { border-top-color: var(--color-cargo-bar); }
  .cold-chain-app .summary-card.machine { border-top-color: var(--color-machine-bar); }

  .cold-chain-app .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; background: var(--color-surface); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--color-border); }
  .cold-chain-app .toolbar-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  .cold-chain-app .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-muted); user-select: none; cursor: pointer; margin: 0; }
  .cold-chain-app .toggle input { cursor: pointer; margin: 0; }
  .cold-chain-app .updated-at { font-size: 12px; color: var(--color-text-muted); }

  .cold-chain-app .panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 0; overflow: hidden; }
  .cold-chain-app .status-msg { padding: 18px 20px; display: flex; align-items: center; gap: 10px; color: var(--color-text-muted); }
  .cold-chain-app .status-msg.error { color: var(--color-go-fg); background: var(--color-go-bg); }
  .cold-chain-app .spinner { width: 16px; height: 16px; border-radius: 50%; flex: none; border: 2px solid var(--color-border); border-top-color: var(--color-accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cold-chain-app .table-scroll { overflow: auto; max-height: calc(100vh - 330px); }
  .cold-chain-app table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; margin: 0; }
  .cold-chain-app th, .cold-chain-app td { padding: 9px 14px; border-bottom: 1px solid var(--color-border); text-align: left; white-space: nowrap; }
  .cold-chain-app th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--color-text-muted); background: #FAFCFE; position: sticky; top: 0; z-index: 10; font-weight: 600; border-bottom: 2px solid var(--color-border); }
  .cold-chain-app tbody tr:hover { background: #FAFCFE; }
  .cold-chain-app .device-name { font-weight: 600; }
  .cold-chain-app .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .cold-chain-app .badge.ok { background: var(--color-ok-bg); color: var(--color-ok-fg); }
  .cold-chain-app .badge.go { background: var(--color-go-bg); color: var(--color-go-fg); }
  .cold-chain-app .badge.iox { background: var(--color-iox-bg); color: var(--color-iox-fg); }
  .cold-chain-app .badge.cargo { background: var(--color-cargo-bg); color: var(--color-cargo-fg); }
  .cold-chain-app .badge.machine { background: var(--color-machine-bg); color: var(--color-machine-fg); }
  .cold-chain-app .cell-muted { color: var(--color-text-muted); font-size: 12px; }
  .cold-chain-app .cell-val { font-family: var(--font-mono); font-weight: 600; }
  .cold-chain-app .cell-na { color: #B8C4CF; font-style: italic; font-size: 12px; }
  .cold-chain-app .empty-cell { text-align: center; padding: 40px 20px; color: var(--color-text-muted); }
  .cold-chain-app .temp-val { display: inline-block; min-width: 45px; }

  @media (max-width: 720px) {
    .cold-chain-app { padding: 14px; }
    .cold-chain-app .summary { flex-direction: column; }
    .cold-chain-app .toolbar { flex-direction: column; align-items: flex-start; }
  }
</style>

  <div class="cold-chain-app">
    <header class="topbar">
      <div class="topbar-left">
        <svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#0F2A47"/>
          <path d="M14 6a2.3 2.3 0 0 0-2.3 2.3v9.2a3.6 3.6 0 1 0 4.6 0V8.3A2.3 2.3 0 0 0 14 6z" fill="none" stroke="#EAF6FF" stroke-width="1.5"/>
          <circle cx="14" cy="19.5" r="2.1" fill="#0EA5E9"/>
          <rect x="12.9" y="10" width="2.2" height="7" rx="1.1" fill="#0EA5E9"/>
          <path d="M23 8l3.6 6.2H19.4L23 8z" fill="#F59E0B"/>
          <rect x="22.5" y="15.4" width="1" height="3.6" fill="#0F2A47"/>
          <circle cx="23" cy="20" r="0.7" fill="#0F2A47"/>
        </svg>
        <div>
          <h1>Monitor de Frigoríficos</h1>
          <p class="subtitle">Salud de la cadena de frío &middot; GO &middot; termógrafo/sondas &middot; máquina de frío</p>
        </div>
      </div>
      <button type="button" id="refreshBtn" class="btn btn-primary" disabled>Actualizar</button>
    </header>

    <div class="toolbar">
      <div class="toolbar-left">
        <select id="groupSelector" class="form-select">
          <option value="">Cargando grupos...</option>
        </select>
        <label class="toggle">
          <input type="checkbox" id="onlyProblemsToggle">
          Mostrar solo activos con problema
        </label>
        <label class="toggle">
          <input type="checkbox" id="hideNoMachineToggle">
          Ocultar sin máquina de frío
        </label>
      </div>
      <span class="updated-at" id="updatedAt"></span>
    </div>

    <div class="summary" id="summaryBar" hidden>
      <div class="summary-card ok"><div class="num" id="sumOk">0</div><div class="lbl">OK</div></div>
      <div class="summary-card go"><div class="num" id="sumGo">0</div><div class="lbl">GO sin comunicar</div></div>
      <div class="summary-card iox"><div class="num" id="sumIox">0</div><div class="lbl">IOX no detectado</div></div>
      <div class="summary-card cargo"><div class="num" id="sumCargo">0</div><div class="lbl">Termógrafo/Sondas con problema</div></div>
      <div class="summary-card machine"><div class="num" id="sumMachine">0</div><div class="lbl">Máquina de frío sin datos</div></div>
    </div>

    <section class="panel">
      <div class="table-scroll">
        <table id="resultsTable" hidden></table>
      </div>
      <div class="status-msg" id="statusMsg"><span class="spinner"></span><span>Inicializando...</span></div>
    </section>
  </div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    thresholdHoursGo: 48,
    thresholdHoursCargo: 48,
    thresholdHoursMachine: 48,
    lookbackDaysEquipped: 60,
    autoRefreshMinutes: 5,
    storageKeyGroup: 'coldChainSelectedGroup',
    defaultGroupName: 'Cadena de frío'
  };

  // Termógrafo + sondas remotas
  var CARGO_DIAGNOSTICS = [
    { id: 'ThermographTemperature1Id', label: 'Termógrafo 1' },
    { id: 'ThermographTemperature2Id', label: 'Termógrafo 2' },
    { id: 'ThermographStatusId', label: 'Estado termógrafo' },
    { id: 'RemoteProbe1TemperatureId', label: 'Sonda remota 1' },
    { id: 'RemoteProbe2TemperatureId', label: 'Sonda remota 2' },
    { id: 'RemoteProbe3TemperatureId', label: 'Sonda remota 3' }
  ];
  
  var THERMOGRAPH_STATUS_DIAGNOSTIC_ID = 'ThermographStatusId';
  var THERMOGRAPH_STATUS_NAMES = {
    0: 'Deshabilitado',
    1: 'Activado',
    2: 'Desactivado',
    3: 'Error'
  };

  var THERMO_MODEL_ID = 'a5IuZRNSymkS_lkDlsgRgpg';
  var MODEL_NAMES = {
    2: 'Rey térmico', 3: 'Portador', 4: 'Transcan', 5: 'Euroscan',
    10: 'Termotrans', 11: 'Datacold y euroscan', 13: 'Transcan 2',
    14: 'Hecho sistemi', 15: 'Apache'
  };

  // IOX Ureader e IOX Cold
  var IOX_DIAGNOSTICS = [
    { id: 'DiagnosticExternalDeviceIntendiaId', label: 'uReader', family: 'uReader' },
    { id: 'azRjqdVaIxkSmbO5V-0khgA', label: 'uReader (Intendia) estado', family: 'uReader' },
    { id: 'DiagnosticExternalDeviceIOXColdChainId', label: 'IOX-COLD', family: 'IOX-COLD' },
    { id: 'DiagnosticIOXColdConnectionStatusId', label: 'IOX-COLD conexión', family: 'IOX-COLD' },
    { id: 'DiagnosticIOXColdRuggedConnectionStatusId', label: 'IOX-COLD RUGGED conexión', family: 'IOX-COLD' }
  ];
  
  var IOX_EQUIPPED_DIAGNOSTIC_IDS = ['DiagnosticExternalDeviceIntendiaId', 'azRjqdVaIxkSmbO5V-0khgA', 'DiagnosticExternalDeviceIOXColdChainId'];
  var IOX_CONNECTION_VALUE_IDS = ['DiagnosticIOXColdConnectionStatusId', 'DiagnosticIOXColdRuggedConnectionStatusId'];
  var IOX_DISCONNECTED_VALUE = 0;

  // Máquina de frío
  var MACHINE_DIAGNOSTICS = [
    { id: 'RefrigerationUnitSetTemperatureZone1Id', label: 'Consigna zona 1' },
    { id: 'RefrigerationUnitSetTemperatureZone2Id', label: 'Consigna zona 2' },
    { id: 'RefrigerationUnitTemperatureZone1Id', label: 'Retorno zona 1' },
    { id: 'RefrigerationUnitTemperatureZone2Id', label: 'Retorno zona 2' },
    { id: 'RefrigerationUnitStatusId', label: 'Estado unidad' }
  ];
  var MACHINE_EQUIPPED_DIAGNOSTIC_ID = 'RefrigerationUnitStatusId';

  geotab.addin.coldChainHealthMonitor = function () {
    var api = null;
    var el = {};
    var allRows = [];
    var autoRefreshTimer = null;
    var groupsDict = {};

    function $(id) { return document.getElementById(id); }

    function cacheElements() {
      el.refreshBtn = $('refreshBtn');
      el.groupSelector = $('groupSelector');
      el.summaryBar = $('summaryBar');
      el.sumOk = $('sumOk');
      el.sumGo = $('sumGo');
      el.sumIox = $('sumIox');
      el.sumCargo = $('sumCargo');
      el.sumMachine = $('sumMachine');
      el.onlyProblemsToggle = $('onlyProblemsToggle');
      el.hideNoMachineToggle = $('hideNoMachineToggle');
      el.updatedAt = $('updatedAt');
      el.resultsTable = $('resultsTable');
      el.statusMsg = $('statusMsg');
    }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    function formatDateTimeEs(ms) {
      if (!ms) return null;
      var d = new Date(ms);
      return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function hoursAgo(ms, now) {
      if (!ms) return null;
      return (now - ms) / 3600000;
    }

    function isFresh(ms, thresholdHours, now) {
      if (!ms) return false;
      return hoursAgo(ms, now) <= thresholdHours;
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str === null || str === undefined ? '' : String(str);
      return div.innerHTML;
    }

    function formatTemp(val) {
      if (val === null || val === undefined) return '<span class="cell-na">&mdash;</span>';
      return '<span class="cell-val temp-val">' + Number(val).toFixed(1) + ' °C</span>';
    }

    function showStatus(type, message) {
      el.statusMsg.hidden = false;
      el.statusMsg.className = 'status-msg' + (type === 'error' ? ' error' : '');
      el.statusMsg.innerHTML = (type === 'loading' ? '<span class="spinner"></span>' : '') + '<span>' + escapeHtml(message) + '</span>';
      el.resultsTable.hidden = true;
      el.summaryBar.hidden = true;
    }

    function hideStatus() {
      el.statusMsg.hidden = true;
    }

    // ---- Carga de Grupos ----
    function loadGroups() {
      showStatus('loading', 'Cargando grupos...');
      api.call('Get', { typeName: 'Group' }, function (groups) {
        groupsDict = {};
        var validGroups = [];
        
        groups.forEach(function(g) {
          groupsDict[g.id] = g;
          // Evitar grupos raíz genéricos si es posible, o simplemente listar todos los que tienen nombre
          if (g.name && g.id !== 'GroupCompanyId') {
            validGroups.push(g);
          }
        });
        
        validGroups.sort(function(a, b) { return a.name.localeCompare(b.name); });
        
        var optionsHtml = '<option value="">-- Selecciona un grupo --</option>';
        validGroups.forEach(function(g) {
          optionsHtml += '<option value="' + escapeHtml(g.id) + '">' + escapeHtml(g.name) + '</option>';
        });
        el.groupSelector.innerHTML = optionsHtml;
        
        // Restaurar selección o buscar por defecto
        var savedGroup = localStorage.getItem(CONFIG.storageKeyGroup);
        if (savedGroup && groupsDict[savedGroup]) {
          el.groupSelector.value = savedGroup;
        } else {
          var defaultGrp = validGroups.find(function(g) { return g.name === CONFIG.defaultGroupName; });
          if (defaultGrp) {
            el.groupSelector.value = defaultGrp.id;
          }
        }
        
        el.refreshBtn.disabled = false;
        
        if (el.groupSelector.value) {
          loadPanel();
        } else {
          showStatus(null, 'Por favor, selecciona un grupo para monitorizar.');
        }
        
      }, function(err) {
        console.error('Error cargando grupos', err);
        showStatus('error', 'No se pudieron cargar los grupos.');
      });
    }

    // ---- Carga de datos ----
    function loadPanel() {
      var groupId = el.groupSelector.value;
      if (!groupId) {
        showStatus(null, 'Por favor, selecciona un grupo.');
        return;
      }
      
      localStorage.setItem(CONFIG.storageKeyGroup, groupId);
      el.refreshBtn.disabled = true;
      showStatus('loading', 'Obteniendo activos del grupo...');

      // Obtenemos dispositivos para filtrar a los que pertenecen directamente al grupo
      api.call('Get', { typeName: 'Device', search: { groups: [{ id: groupId }] } }, function (devices) {
        var nowTime = new Date().getTime();
        var directDevices = devices.filter(function(d) {
          var inGroup = d.groups && d.groups.some(function(g) { return g.id === groupId; });
          var isActive = !d.activeTo || (new Date(d.activeTo).getTime() > nowTime);
          return inGroup && isActive;
        });
        
        if (directDevices.length === 0) {
          el.refreshBtn.disabled = false;
          allRows = [];
          renderSummary(allRows);
          renderTable(allRows, new Date());
          showStatus(null, 'No hay activos configurados directamente en este grupo.');
          return;
        }
        
        fetchSignals(directDevices, groupId);
      }, function (err) {
        el.refreshBtn.disabled = false;
        console.error('Error obteniendo activos', err);
        showStatus('error', 'No se pudo obtener la lista de activos. Inténtalo de nuevo.');
      });
    }

    function fetchSignals(devices, groupId) {
      var now = new Date();
      showStatus('loading', 'Analizando señales de la flota (' + devices.length + ' activos)...');
      
      var freshFrom = new Date(now.getTime() - CONFIG.thresholdHoursCargo * 3600000); // 48h
      var equippedFrom = new Date(now.getTime() - CONFIG.lookbackDaysEquipped * 86400000); // 60 días
      var fields = { fields: ['device', 'dateTime', 'data'] };
      var devSearch = { groups: [{ id: groupId }] };

      var calls = [];
      
      // 0: DeviceStatusInfo (para GO) - no usa fromDate/toDate, devuelve el estado actual
      calls.push(['Get', {
        typeName: 'DeviceStatusInfo',
        search: { deviceSearch: devSearch },
        propertySelector: { fields: ['device', 'isDeviceCommunicating', 'dateTime'] }
      }]);
      
      // 1-6: termógrafo/sondas (frescura)
      CARGO_DIAGNOSTICS.forEach(function (d) {
        calls.push(['Get', {
          typeName: 'StatusData',
          search: { diagnosticSearch: { id: d.id }, deviceSearch: devSearch, fromDate: freshFrom.toISOString(), toDate: now.toISOString() },
          propertySelector: fields
        }]);
      });
      
      // 7: Modelo de termógrafo (equipado - 60 días)
      calls.push(['Get', {
        typeName: 'StatusData',
        search: { diagnosticSearch: { id: THERMO_MODEL_ID }, deviceSearch: devSearch, fromDate: equippedFrom.toISOString(), toDate: now.toISOString() },
        propertySelector: fields
      }]);

      // 8-12: IOX Ureader + IOX Cold (frescura)
      IOX_DIAGNOSTICS.forEach(function (d) {
        calls.push(['Get', {
          typeName: 'StatusData',
          search: { diagnosticSearch: { id: d.id }, deviceSearch: devSearch, fromDate: freshFrom.toISOString(), toDate: now.toISOString() },
          propertySelector: fields
        }]);
      });
      
      // 13-14: IOX (¿equipado?, 60 días)
      IOX_EQUIPPED_DIAGNOSTIC_IDS.forEach(function (diagId) {
        calls.push(['Get', {
          typeName: 'StatusData',
          search: { diagnosticSearch: { id: diagId }, deviceSearch: devSearch, fromDate: equippedFrom.toISOString(), toDate: now.toISOString() },
          propertySelector: { fields: ['device', 'data'] }
        }]);
      });
      
      // 15-19: máquina de frío (frescura)
      MACHINE_DIAGNOSTICS.forEach(function (d) {
        calls.push(['Get', {
          typeName: 'StatusData',
          search: { diagnosticSearch: { id: d.id }, deviceSearch: devSearch, fromDate: freshFrom.toISOString(), toDate: now.toISOString() },
          propertySelector: fields
        }]);
      });
      
      // 20: máquina de frío (¿equipado?, 60 días)
      calls.push(['Get', {
        typeName: 'StatusData',
        search: { diagnosticSearch: { id: MACHINE_EQUIPPED_DIAGNOSTIC_ID }, deviceSearch: devSearch, fromDate: equippedFrom.toISOString(), toDate: now.toISOString() },
        propertySelector: { fields: ['device'] }
      }]);
      
      // 21: Trip (último viaje)
      calls.push(['Get', {
        typeName: 'Trip',
        search: { deviceSearch: devSearch, fromDate: freshFrom.toISOString(), toDate: now.toISOString() },
        propertySelector: { fields: ['device', 'stop'] }
      }]);

      api.multiCall(calls, function (results) {
        el.refreshBtn.disabled = false;
        processResults(devices, results || [], now);
      }, function (err) {
        el.refreshBtn.disabled = false;
        console.error('Error consultando señales de la flota', err);
        var msg = err ? (err.message || JSON.stringify(err)) : 'Error desconocido';
        showStatus('error', 'Error API: ' + msg);
      });
    }

    function maxByDevice(records, dateField, into) {
      var map = into || {};
      (records || []).forEach(function (r) {
        if (!r || !r.device || !r.device.id || !r[dateField]) return;
        var t = new Date(r[dateField]).getTime();
        if (!map[r.device.id] || t > map[r.device.id]) map[r.device.id] = t;
      });
      return map;
    }

    function latestByDevice(records, dateField, into) {
      var map = into || {};
      (records || []).forEach(function (r) {
        if (!r || !r.device || !r.device.id || !r[dateField]) return;
        var t = new Date(r[dateField]).getTime();
        if (!map[r.device.id] || t > map[r.device.id].time) map[r.device.id] = { time: t, data: r.data };
      });
      return map;
    }

    function toIdSet(records) {
      var set = {};
      (records || []).forEach(function (r) { if (r && r.device && r.device.id) set[r.device.id] = true; });
      return set;
    }

    function arrayByDiagId(arrays, diagnostics, diagId) {
      var i = diagnostics.map(function (d) { return d.id; }).indexOf(diagId);
      return i === -1 ? [] : arrays[i];
    }

    function processResults(devices, results, now) {
      var idx = 0;
      var deviceStatusRecords = results[idx++] || [];
      var cargoArrays = CARGO_DIAGNOSTICS.map(function () { return results[idx++] || []; });
      var thermoModelRecords = results[idx++] || [];
      var ioxArrays = IOX_DIAGNOSTICS.map(function () { return results[idx++] || []; });
      var ioxEquippedRecords = IOX_EQUIPPED_DIAGNOSTIC_IDS.map(function () { return results[idx++] || []; });
      var machineArrays = MACHINE_DIAGNOSTICS.map(function () { return results[idx++] || []; });
      var machineEquippedRecords = results[idx++] || [];
      var tripRecords = results[idx++] || [];

      // Procesar GO: extraemos lastCommunicatedUtc o dateTime
      var goLastSeen = {};
      deviceStatusRecords.forEach(function(dsi) {
         if (dsi && dsi.device && dsi.device.id) {
           var dt = dsi.lastCommunicatedUtc || dsi.dateTime;
           if (dt) goLastSeen[dsi.device.id] = new Date(dt).getTime();
         }
      });

      var cargoLastSeen = {};
      cargoArrays.forEach(function (arr) { maxByDevice(arr, 'dateTime', cargoLastSeen); });
      
      var thermoModelLatest = latestByDevice(thermoModelRecords, 'dateTime', {});
      
      // Temperaturas exactas actuales (últimos valores)
      var tempZ1Latest = latestByDevice(arrayByDiagId(cargoArrays, CARGO_DIAGNOSTICS, 'ThermographTemperature1Id'), 'dateTime', {});
      var tempZ2Latest = latestByDevice(arrayByDiagId(cargoArrays, CARGO_DIAGNOSTICS, 'ThermographTemperature2Id'), 'dateTime', {});

      // Determinar familia IOX equipada (uReader o IOX-COLD)
      var ioxEquippedDetails = {};
      ioxEquippedRecords.forEach(function (arr, i) {
        var diagId = IOX_EQUIPPED_DIAGNOSTIC_IDS[i];
        var family = (diagId === 'DiagnosticExternalDeviceIOXColdChainId') ? 'IOX-COLD' : 'uReader';
        arr.forEach(function(r) {
          if (r && r.device && r.device.id) {
            ioxEquippedDetails[r.device.id] = family;
          }
        });
      });

      var ioxLastSeen = {};
      ioxArrays.forEach(function (arr) { maxByDevice(arr, 'dateTime', ioxLastSeen); });
      
      var machineLastSeen = {};
      machineArrays.forEach(function (arr) { maxByDevice(arr, 'dateTime', machineLastSeen); });
      var machineEquippedSet = toIdSet(machineEquippedRecords);
      var tripLastSeen = maxByDevice(tripRecords, 'stop');

      var ioxConnectionLatest = {};
      IOX_CONNECTION_VALUE_IDS.forEach(function (diagId) {
        latestByDevice(arrayByDiagId(ioxArrays, IOX_DIAGNOSTICS, diagId), 'dateTime', ioxConnectionLatest);
      });
      
      var thermoStatusLatest = latestByDevice(arrayByDiagId(cargoArrays, CARGO_DIAGNOSTICS, THERMOGRAPH_STATUS_DIAGNOSTIC_ID), 'dateTime', {});

      // Construir filas para todos los dispositivos directos
      allRows = devices.map(function (dev) {
        var goTime = goLastSeen[dev.id] || null;
        var cargoTime = cargoLastSeen[dev.id] || null;
        
        var thermoExplicitStatus = null;
        if (thermoStatusLatest[dev.id] && thermoStatusLatest[dev.id].data !== undefined) {
           var ts = thermoStatusLatest[dev.id].data;
           if (ts === 0 || ts === 2 || ts === 3) {
             thermoExplicitStatus = THERMOGRAPH_STATUS_NAMES[ts] || 'Error';
           }
        }
        
        var modelId = thermoModelLatest[dev.id] ? thermoModelLatest[dev.id].data : null;
        var modelName = modelId && MODEL_NAMES[modelId] ? MODEL_NAMES[modelId] : (modelId ? 'Mod. ' + modelId : null);
        
        var t1 = tempZ1Latest[dev.id] ? tempZ1Latest[dev.id].data : null;
        var t2 = tempZ2Latest[dev.id] ? tempZ2Latest[dev.id].data : null;

        var ioxFamily = ioxEquippedDetails[dev.id] || null;
        var ioxTime = ioxLastSeen[dev.id] || null;
        var ioxExplicitDisconnected = !!(ioxConnectionLatest[dev.id] && ioxConnectionLatest[dev.id].data === IOX_DISCONNECTED_VALUE);
        
        var machineEquipped = !!machineEquippedSet[dev.id];
        var machineTime = machineLastSeen[dev.id] || null;
        var tripTime = tripLastSeen[dev.id] || null;
        
        var status = computeStatus(goTime, ioxFamily, ioxTime, ioxExplicitDisconnected, cargoTime, thermoExplicitStatus, machineEquipped, machineTime, now);
        
        return {
          device: dev, status: status,
          goTime: goTime, 
          cargoTime: cargoTime, thermoExplicitStatus: thermoExplicitStatus,
          modelName: modelName, tempZ1: t1, tempZ2: t2,
          ioxFamily: ioxFamily, ioxTime: ioxTime, ioxExplicitDisconnected: ioxExplicitDisconnected,
          machineEquipped: machineEquipped, machineTime: machineTime,
          tripTime: tripTime
        };
      });

      allRows.sort(function (a, b) {
        var order = { go: 0, iox: 1, cargo: 2, machine: 3, ok: 4 };
        if (order[a.status.level] !== order[b.status.level]) return order[a.status.level] - order[b.status.level];
        return a.device.name.localeCompare(b.device.name);
      });

      hideStatus();
      renderSummary(allRows);
      renderTable(allRows, now);
      el.updatedAt.textContent = 'Actualizado ' + formatDateTimeEs(now.getTime());
    }

    function computeStatus(goTime, ioxFamily, ioxTime, ioxExplicitDisconnected, cargoTime, thermoExplicitStatus, machineEquipped, machineTime, now) {
      if (!isFresh(goTime, CONFIG.thresholdHoursGo, now)) {
        return { level: 'go', label: 'GO sin comunicar' };
      }
      if (ioxExplicitDisconnected || (ioxFamily && !isFresh(ioxTime, CONFIG.thresholdHoursCargo, now))) {
        return { level: 'iox', label: 'IOX no detectado' };
      }
      if (thermoExplicitStatus) {
        return { level: 'cargo', label: 'Termógrafo: ' + thermoExplicitStatus };
      }
      if (!isFresh(cargoTime, CONFIG.thresholdHoursCargo, now)) {
        return { level: 'cargo', label: 'Sin termógrafo/sondas' };
      }
      if (machineEquipped && !isFresh(machineTime, CONFIG.thresholdHoursMachine, now)) {
        return { level: 'machine', label: 'Máquina de frío sin datos' };
      }
      return { level: 'ok', label: 'OK' };
    }

    function renderSummary(rows) {
      var counts = { ok: 0, go: 0, iox: 0, cargo: 0, machine: 0 };
      var hideNoMachine = el.hideNoMachineToggle.checked;
      
      rows.forEach(function (r) { 
        if (hideNoMachine && !r.machineEquipped) return; // Ignorar del summary si se ocultan
        counts[r.status.level]++; 
      });
      
      el.sumOk.textContent = counts.ok;
      el.sumGo.textContent = counts.go;
      el.sumIox.textContent = counts.iox;
      el.sumCargo.textContent = counts.cargo;
      el.sumMachine.textContent = counts.machine;
      el.summaryBar.hidden = false;
    }

    function cellTime(ms, now, thresholdHours, explicitErrorText) {
      if (explicitErrorText) {
        return '<span class="cell-muted" style="color:var(--color-go-fg); font-weight:600;">' + explicitErrorText + '</span><br>' +
               '<span class="cell-muted" style="font-size:11px;">(últ. dato: ' + (ms ? formatDateTimeEs(ms) : 'N/D') + ')</span>';
      }
      if (!ms) return '<span class="cell-na">&mdash;</span>';
      var h = hoursAgo(ms, now);
      var text = h < 1 ? Math.round(h * 60) + ' min' : Math.round(h) + ' h';
      return '<span class="cell-muted" title="' + formatDateTimeEs(ms) + '">hace ' + text + '</span>';
    }

    function renderTable(rows, now) {
      var onlyProblems = el.onlyProblemsToggle.checked;
      var hideNoMachine = el.hideNoMachineToggle.checked;
      
      var visible = rows.filter(function (r) {
        if (hideNoMachine && !r.machineEquipped) return false;
        if (onlyProblems && r.status.level === 'ok') return false;
        return true;
      });

      if (visible.length === 0) {
        el.resultsTable.hidden = true;
        showStatus(null, '');
        el.statusMsg.hidden = false;
        el.statusMsg.className = 'status-msg';
        el.statusMsg.innerHTML = '<span>No hay activos que coincidan con los filtros actuales.</span>';
        return;
      }
      
      hideStatus();

      var thead = '<thead><tr>' +
        '<th>Activo</th><th>Estado</th><th>GO</th><th>IOX</th><th>Termógrafo/Sondas</th><th>Modelo Term.</th><th>Temp Z1</th><th>Temp Z2</th><th>Máquina de frío</th><th>Último viaje</th>' +
        '</tr></thead>';

      var tbody = '<tbody>' + visible.map(function (r) {
        var ioxCellText = r.ioxFamily ? r.ioxFamily : 'Sin histórico IOX';
        var ioxCell = r.ioxFamily
          ? '<div><span class="cell-val">' + r.ioxFamily + '</span><br>' + cellTime(r.ioxTime, now, CONFIG.thresholdHoursCargo, r.ioxExplicitDisconnected ? 'Desconectado' : null) + '</div>'
          : '<span class="cell-na">Sin histórico IOX</span>';
          
        var machineCell = r.machineEquipped
          ? cellTime(r.machineTime, now, CONFIG.thresholdHoursMachine)
          : '<span class="cell-na">Sin máquina conectada</span>';
          
        var modelCell = r.modelName 
          ? '<span class="cell-val">' + escapeHtml(r.modelName) + '</span>' 
          : '<span class="cell-na">&mdash;</span>';

        return '<tr>' +
          '<td class="device-name">' + escapeHtml(r.device.name) + '</td>' +
          '<td><span class="badge ' + r.status.level + '">' + escapeHtml(r.status.label) + '</span></td>' +
          '<td>' + cellTime(r.goTime, now, CONFIG.thresholdHoursGo) + '</td>' +
          '<td>' + ioxCell + '</td>' +
          '<td>' + cellTime(r.cargoTime, now, CONFIG.thresholdHoursCargo, r.thermoExplicitStatus) + '</td>' +
          '<td>' + modelCell + '</td>' +
          '<td>' + formatTemp(r.tempZ1) + '</td>' +
          '<td>' + formatTemp(r.tempZ2) + '</td>' +
          '<td>' + machineCell + '</td>' +
          '<td>' + cellTime(r.tripTime, now, 999999) + '</td>' +
          '</tr>';
      }).join('') + '</tbody>';

      el.resultsTable.innerHTML = thead + tbody;
      el.resultsTable.hidden = false;
    }

    function wireEvents() {
      el.refreshBtn.addEventListener('click', loadPanel);
      el.groupSelector.addEventListener('change', loadPanel);
      
      el.onlyProblemsToggle.addEventListener('change', function () { 
        renderTable(allRows, new Date()); 
      });
      
      el.hideNoMachineToggle.addEventListener('change', function () { 
        renderSummary(allRows);
        renderTable(allRows, new Date()); 
      });
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(loadPanel, CONFIG.autoRefreshMinutes * 60000);
    }

    return {
      initialize: function (freshApi, freshState, callback) {
        api = freshApi;
        cacheElements();
        wireEvents();
        loadGroups();
        startAutoRefresh();
        if (typeof callback === 'function') callback();
      },
      focus: function (freshApi, freshState) {
        api = freshApi;
        if (el.groupSelector.value) {
          loadPanel();
        }
      },
      blur: function () {
        if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
      }
    };
  };
})();
</script>
</body>
</html>
